{% extends 'base_content.html' %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col-12 col-lg-6">
      <h1>Edit profile</h1>
      <form action="{% url 'edit_profile' %}" method="post">
        {% csrf_token %}
        {% include 'partials/bootstrap_form.html' with form=form %}
        <input type="submit" value="Update" class="btn btn-primary">
      </form>
      <!-- Change Gravatar Button -->
      <a href="https://gravatar.com/emails" target="_blank" class="btn btn-outline-secondary mt-3">
        <span class="bi-person-circle px-2"></span>Update Gravatar
      </a>
    </div>

    <div class="col-12 col-lg-6">
      {% include 'partials/profile_preview.html' %}
    </div>
  </div>
</div>
{% endblock %}
