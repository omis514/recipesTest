{% extends 'base_content.html' %}
{% load widget_tweaks %}
{% block content %}
  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">
        <div class="card glass-card shadow-sm">
          <div class="card-header glass-header">
            <h2 class="mb-0 text-white">
              <i class="bi bi-plus-circle me-2"></i>Create New Recipe
            </h2>
          </div>
          <div class="card-body p-4">
            {% include "partials/recipe_form.html" with form_action=form_action cancel_url=cancel_url submit_text=submit_text is_edit=False %}
          </div>
        </div>
      </div>
    </div>

    {% include "partials/recipe_form_scripts.html" %}
  </div>
{% endblock %}
